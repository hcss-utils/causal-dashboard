name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: causal-dashboard-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REDLINES_DB_HOST: ${{ secrets.REDLINES_DB_HOST }}
      REDLINES_DB_PORT: ${{ secrets.REDLINES_DB_PORT }}
      REDLINES_DB_NAME: ${{ secrets.REDLINES_DB_NAME }}
      REDLINES_DB_USER: ${{ secrets.REDLINES_DB_USER }}
      REDLINES_DB_PASSWORD: ${{ secrets.REDLINES_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v5

      - name: Export RRLS/NTS data from redlines DB
        if: ${{ env.REDLINES_DB_HOST != '' && env.REDLINES_DB_PASSWORD != '' }}
        run: UV_CACHE_DIR=.uv-cache uv run --with psycopg2-binary python scripts/export_redlines_static.py

      - name: Commit refreshed RRLS/NTS data
        if: ${{ env.REDLINES_DB_HOST != '' && env.REDLINES_DB_PASSWORD != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rrls_monthly.json public/data/rrls_statements.json public/data/nts_monthly.json public/data/nts_statements.json
          git diff --cached --quiet || git commit -m "Update redlines data"
          git push
      - run: npm ci

      - name: Build for hcss-utils/causal-dashboard
        run: npm run build
        env:
          VITE_BASE: /causal-dashboard/

      - name: Deploy to hcss-utils/causal-dashboard gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Build for sdspieg/russian_redlines-causal-dashboard (legacy URL mirror)
        if: ${{ env.SDSPIEG_PAGES_PAT != '' }}
        env:
          SDSPIEG_PAGES_PAT: ${{ secrets.SDSPIEG_PAGES_PAT }}
          VITE_BASE: /russian_redlines-causal-dashboard/
        run: npm run build

      - name: Deploy to sdspieg/russian_redlines-causal-dashboard (legacy URL mirror)
        if: ${{ env.SDSPIEG_PAGES_PAT != '' }}
        env:
          SDSPIEG_PAGES_PAT: ${{ secrets.SDSPIEG_PAGES_PAT }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.SDSPIEG_PAGES_PAT }}
          external_repository: sdspieg/russian_redlines-causal-dashboard
          publish_branch: gh-pages
          publish_dir: ./dist
